<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jardín Emocional</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Work+Sans:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Work Sans', sans-serif;
    background: #101B17;
    color: #F1EDE4;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 40px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-size: 1.6rem;
    margin: 0 0 2px;
    text-align: center;
  }

  .subtitle {
    color: #A9B8AF;
    font-size: 0.9rem;
    text-align: center;
    margin: 0;
  }

  .terrarium {
    width: 100%;
    background: #1B2B24;
    border: 1px solid rgba(241,237,228,0.12);
    border-radius: 160px 160px 20px 20px;
    padding: 10px 10px 0;
  }

  .terrarium svg { width: 100%; display: block; }

  .stage-tag { font-size: 0.8rem; color: #A9B8AF; text-align: center; }

  .stats { display: flex; gap: 20px; font-size: 0.85rem; color: #A9B8AF; }
  .stats strong { color: #F1EDE4; }

  .label { font-size: 0.85rem; color: #A9B8AF; text-align: center; }

  .picker {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 100%;
  }

  .emotion-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 10px 4px;
    border-radius: 14px;
    border: 1px solid rgba(241,237,228,0.12);
    background: rgba(241,237,228,0.03);
    color: #F1EDE4;
    font-family: 'Work Sans', sans-serif;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .emotion-btn.active {
    box-shadow: 0 0 0 2px var(--dot) inset;
  }
  .emotion-btn .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--dot);
  }

  .feel-box {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .feel-box textarea {
    width: 100%;
    background: rgba(241,237,228,0.04);
    border: 1px solid rgba(241,237,228,0.15);
    border-radius: 10px;
    color: #F1EDE4;
    font-family: 'Work Sans', sans-serif;
    font-size: 0.85rem;
    padding: 8px 10px;
    resize: vertical;
  }
  .feel-box .save-row {
    display: flex;
    justify-content: flex-end;
  }

  .suggestion {
    width: 100%;
    background: rgba(241,237,228,0.04);
    border: 1px solid rgba(241,237,228,0.12);
    border-left: 3px solid #F1EDE4;
    border-radius: 10px;
    padding: 10px 14px;
    display: none;
  }
  .suggestion strong { font-family: 'Fraunces', serif; display: block; margin-bottom: 4px; }
  .suggestion p { margin: 0; font-size: 0.82rem; color: #A9B8AF; line-height: 1.4; }

  .row { display: flex; justify-content: space-between; width: 100%; }

  button.link {
    background: none;
    border: none;
    color: #A9B8AF;
    font-family: 'Work Sans', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
  }
  button.link:hover { color: #F1EDE4; }

  .demo-btn {
    width: 100%;
    text-align: center;
    border: 1px dashed rgba(241,237,228,0.2);
    border-radius: 10px;
    padding: 8px;
  }

  .history {
    display: flex;
    gap: 5px;
    width: 100%;
    overflow-x: auto;
    display: none;
  }
  .history-day {
    flex: 0 0 auto;
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 1px solid rgba(241,237,228,0.12);
  }

  .footnote {
    font-size: 0.72rem;
    color: #A9B8AF;
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="card">
  <div>
    <h1>Tu jardín emocional</h1>
    <p class="subtitle">Nombra lo que sientes hoy y observa cómo crece con el tiempo.</p>
  </div>

  <div class="terrarium">
    <svg id="plant-svg" viewBox="0 0 400 300"></svg>
  </div>

  <div class="stage-tag" id="stage-label"></div>

  <div class="stats">
    <span><strong id="streak-count">0</strong> días seguidos</span>
    <span><strong id="total-count">0</strong> registros</span>
  </div>

  <div class="label" id="picker-label">¿Cómo te sientes ahora mismo?</div>

  <div class="picker" id="picker"></div>

  <div class="feel-box">
    <label class="label" for="feeling-text">Cuéntame cómo te sientes hoy (opcional)</label>
    <textarea id="feeling-text" rows="2" placeholder="Escribe libremente..."></textarea>
    <div class="save-row">
      <button class="link" id="save-text-btn">Guardar palabras</button>
    </div>
  </div>

  <div class="suggestion" id="suggestion">
    <strong id="suggestion-title"></strong>
    <p id="suggestion-text"></p>
  </div>

  <div class="row">
    <button class="link" id="toggle-history">Ver últimos 14 días</button>
    <button class="link" id="reset-btn">Reiniciar</button>
  </div>

  <button class="link demo-btn" id="demo-btn">Avanzar un día (demo) — día 1 de 7</button>

  <div class="history" id="history"></div>

  <p class="footnote">Basado en etiquetado afectivo y refuerzo de hábitos por constancia: nombrar la emoción y registrarla cada día ayuda a regularla con el tiempo.</p>
</div>

<script>
  // ---------- Datos base ----------
  const STORAGE_KEY = "jardin-emocional:entries";

  const EMOTIONS = [
    { id: "alegria", label: "Alegría", color: "#E3B23C" },
    { id: "calma", label: "Calma", color: "#7FB8A6" },
    { id: "tristeza", label: "Tristeza", color: "#7B93B4" },
    { id: "enojo", label: "Enojo", color: "#C1554D" },
    { id: "ansiedad", label: "Ansiedad", color: "#B98CC4" },
    { id: "estres", label: "Estrés", color: "#9C8A6E" },
  ];

  const TECHNIQUES = {
    enojo: { title: "Antes de reaccionar, pausa", text: "Cuenta hacia atrás desde 10 respirando lento, o camina rápido 2 minutos. Baja el cortisol y la adrenalina antes de responder." },
    tristeza: { title: "Permítete sentirlo, luego actúa en pequeño", text: "Dedica 5 minutos a algo que disfrutes o escribe a alguien de confianza. La activación conductual ayuda a romper el ciclo de bajo ánimo." },
    ansiedad: { title: "Ancla tu atención al presente", text: "Nombra 5 cosas que ves, 4 que tocas, 3 que escuchas, 2 que hueles y 1 que saboreas (grounding 5-4-3-2-1)." },
    estres: { title: "Divide y respira", text: "Tensa y relaja cada grupo muscular 5 segundos, o anota tu próxima tarea como un solo paso pequeño." },
  };

  const emotionById = Object.fromEntries(EMOTIONS.map(e => [e.id, e]));

  // Palabras muy comunes que no aportan significado — se filtran al extraer palabras clave
  const STOPWORDS = new Set(["que","de","la","el","en","y","a","los","las","un","una","es","me","mi",
    "con","por","para","no","si","sí","muy","hoy","estoy","siento","se","lo","al","como","pero","más","tan","esta","este"]);

  function extractKeywords(text) {
    return text
      .toLowerCase()
      .replace(/[.,;:!?¡¿"']/g, "")
      .split(/\s+/)
      .filter(w => w.length > 3 && !STOPWORDS.has(w))
      .slice(0, 4);
  }

  function escapeXml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Junta las palabras clave de los textos de los últimos 7 días registrados
  function weekWords() {
    const recent = [...entries].sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 7);
    let all = [];
    recent.forEach(e => { if (e.text) all = all.concat(extractKeywords(e.text)); });
    return [...new Set(all)].slice(0, 5);
  }

  // ---------- Utilidades de fecha ----------
  function todayStr() {
    const d = new Date();
    return d.toISOString().slice(0, 10);
  }
  function addDays(dateStr, delta) {
    const d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + delta);
    return d.toISOString().slice(0, 10);
  }

  // ---------- Estado (guardado en localStorage) ----------
  function loadEntries() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch { return []; }
  }
  function saveEntries(entries) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }

  let entries = loadEntries();

  // ---------- Lógica del jardín ----------
  function dayCount() {
    return new Set(entries.filter(e => e.emotion).map(e => e.date)).size;
  }
  function getStage() {
    const n = dayCount();
    if (n <= 0) return "seed";
    if (n <= 2) return "sprout";
    if (n <= 6) return "growing";
    if (n <= 13) return "budding";
    return "blooming";
  }
  function computeStreak() {
    const dates = [...new Set(entries.filter(e => e.emotion).map(e => e.date))].sort().reverse();
    if (!dates.length) return 0;
    let streak = 1;
    for (let i = 0; i < dates.length - 1; i++) {
      const diff = Math.round((new Date(dates[i]) - new Date(dates[i + 1])) / 86400000);
      if (diff === 1) streak++; else break;
    }
    const t = todayStr();
    if (dates[0] !== t && dates[0] !== addDays(t, -1)) return 0;
    return streak;
  }
  function dominantEmotion() {
    const recent = [...entries].sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 7);
    const counts = {};
    recent.forEach(e => { if (e.emotion) counts[e.emotion] = (counts[e.emotion] || 0) + 1; });
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    return sorted.length ? sorted[0][0] : "calma";
  }
  function todayEmotion() {
    const e = entries.find(e => e.date === todayStr());
    return e ? e.emotion : null;
  }

  // ---------- Dibujo del SVG de la planta ----------
  const GROWTH = { seed: 0, sprout: 40, growing: 100, budding: 150, blooming: 190 };
  const LEAVES = { seed: 0, sprout: 1, growing: 2, budding: 3, blooming: 4 };
  const STAGE_LABEL = {
    seed: "Semilla recién plantada",
    sprout: "Primeros brotes",
    growing: "Creciendo con constancia",
    budding: "Formando capullos",
    blooming: "En plena floración",
  };

  function drawPlant() {
    const stage = getStage();
    const growth = GROWTH[stage];
    const leafPairs = LEAVES[stage];
    const baseX = 200, baseY = 260, topY = baseY - growth;
    const color = emotionById[dominantEmotion()].color;

    let leaves = "";
    for (let i = 1; i <= leafPairs; i++) {
      const y = baseY - (growth / (leafPairs + 1)) * i;
      const rot = 28 + i * 4;
      leaves += `<g transform="translate(${baseX} ${y}) rotate(${-rot})">
                   <path d="M0,0 C11,-7 24,-5 30,0 C24,5 11,7 0,0 Z" fill="#6E9B6C"/>
                 </g>`;
      leaves += `<g transform="translate(${baseX} ${y}) rotate(${rot}) scale(-1 1)">
                   <path d="M0,0 C11,-7 24,-5 30,0 C24,5 11,7 0,0 Z" fill="#5C8A5C"/>
                 </g>`;
    }

    let flower = "";
    if (stage === "budding") {
      flower = `<ellipse cx="${baseX}" cy="${topY}" rx="6" ry="9" fill="${color}" opacity="0.85"/>`;
    } else if (stage === "blooming") {
      const petals = [0, 60, 120, 180, 240, 300]
        .map(a => `<ellipse cx="0" cy="-9" rx="5.5" ry="10" fill="${color}" opacity="0.92" transform="rotate(${a})"/>`)
        .join("");
      flower = `<g transform="translate(${baseX} ${topY})">${petals}<circle r="5" fill="#F4E3B0"/></g>`;
    }

    // Palabras clave de la semana, dibujadas flotando alrededor de la flor
    let words = "";
    if (stage === "budding" || stage === "blooming") {
      const positions = [
        { dx: -85, dy: -18, rot: -8 },
        { dx: 75, dy: -48, rot: 6 },
        { dx: -60, dy: -78, rot: -4 },
        { dx: 80, dy: -8, rot: 9 },
        { dx: 0, dy: -100, rot: 0 },
      ];
      weekWords().forEach((w, i) => {
        const p = positions[i] || { dx: 0, dy: -40, rot: 0 };
        const x = baseX + p.dx, y = topY + p.dy;
        words += `<text x="${x}" y="${y}" font-family="Fraunces, serif" font-style="italic"
                    font-size="13" fill="#F1EDE4" opacity="0.75" text-anchor="middle"
                    transform="rotate(${p.rot} ${x} ${y})">${escapeXml(w)}</text>`;
      });
    }

    const stem = growth > 0
      ? `<path d="M${baseX},${baseY} C${baseX - 6},${baseY - growth * 0.45} ${baseX + 8},${baseY - growth * 0.7} ${baseX},${topY}"
               fill="none" stroke="#5C8A5C" stroke-width="4.5" stroke-linecap="round"/>`
      : `<ellipse cx="${baseX}" cy="${baseY - 3}" rx="6" ry="4" fill="#7A5C3E"/>`;

    document.getElementById("plant-svg").innerHTML = `
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#132420"/>
          <stop offset="100%" stop-color="#1C302A"/>
        </linearGradient>
      </defs>
      <rect width="400" height="300" fill="url(#sky)"/>
      <circle cx="330" cy="55" r="14" fill="#F4E9C9" opacity="0.9"/>
      <ellipse cx="200" cy="272" rx="98" ry="18" fill="#4A3826"/>
      ${stem}
      ${leaves}
      ${flower}
      ${words}
    `;

    document.getElementById("stage-label").textContent = STAGE_LABEL[stage];
  }

  // ---------- Dibujo del selector de emociones ----------
  function drawPicker() {
    const picker = document.getElementById("picker");
    const current = todayEmotion();
    picker.innerHTML = "";
    EMOTIONS.forEach(({ id, label, color }) => {
      const btn = document.createElement("button");
      btn.className = "emotion-btn" + (current === id ? " active" : "");
      btn.style.setProperty("--dot", color);
      btn.innerHTML = `<span class="dot"></span>${label}`;
      btn.onclick = () => logEmotion(id);
      picker.appendChild(btn);
    });

    document.getElementById("picker-label").textContent = current
      ? `Hoy registraste: ${emotionById[current].label} — puedes cambiarlo si algo cambió`
      : "¿Cómo te sientes ahora mismo?";
  }

  // ---------- Sugerencia de técnica ----------
  function drawSuggestion() {
    const box = document.getElementById("suggestion");
    const current = todayEmotion();
    if (current && TECHNIQUES[current]) {
      box.style.display = "block";
      box.style.borderLeftColor = emotionById[current].color;
      document.getElementById("suggestion-title").textContent = TECHNIQUES[current].title;
      document.getElementById("suggestion-text").textContent = TECHNIQUES[current].text;
    } else {
      box.style.display = "none";
    }
  }

  // ---------- Estadísticas e historial ----------
  function drawStats() {
    document.getElementById("streak-count").textContent = computeStreak();
    document.getElementById("total-count").textContent = dayCount();
  }

  function drawHistory() {
    const wrap = document.getElementById("history");
    wrap.innerHTML = "";
    for (let i = 13; i >= 0; i--) {
      const date = addDays(todayStr(), -i);
      const entry = entries.find(e => e.date === date);
      const div = document.createElement("div");
      div.className = "history-day";
      div.title = (entry && entry.emotion) ? `${date} — ${emotionById[entry.emotion].label}` : date;
      div.style.background = (entry && entry.emotion) ? emotionById[entry.emotion].color : "transparent";
      wrap.appendChild(div);
    }
  }

  function fillFeelingText() {
    const t = todayStr();
    const e = entries.find(x => x.date === t);
    document.getElementById("feeling-text").value = (e && e.text) ? e.text : "";
  }

  function saveFeelingText() {
    const text = document.getElementById("feeling-text").value.trim();
    const t = todayStr();
    const existing = entries.find(e => e.date === t);
    if (existing) existing.text = text;
    else entries.push({ date: t, emotion: null, text });
    saveEntries(entries);
    renderAll();
  }

  // ---------- Acciones ----------
  function logEmotion(id) {
    const t = todayStr();
    entries = entries.filter(e => e.date !== t);
    entries.push({ date: t, emotion: id });
    saveEntries(entries);
    renderAll();
  }

  function resetGarden() {
    if (confirm("¿Borrar todo tu jardín?")) {
      entries = [];
      demoStep = 0;
      saveEntries(entries);
      renderAll();
    }
  }

  let demoStep = 0;
  const demoMix = [
    { emotion: "calma", text: "tranquilo enfocado presente" },
    { emotion: "alegria", text: "contento con energía" },
    { emotion: "estres", text: "cansado abrumado ocupado" },
    { emotion: "ansiedad", text: "nervioso inquieto acelerado" },
    { emotion: "calma", text: "relajado en paz" },
    { emotion: "tristeza", text: "melancólico pensativo callado" },
    { emotion: "alegria", text: "motivado feliz agradecido" },
  ];

  function advanceDemoDay() {
    if (demoStep >= demoMix.length) {
      alert("Ya completaste la demo de 7 días. Dale 'Reiniciar' para verla otra vez.");
      return;
    }
    const date = addDays(todayStr(), -6 + demoStep);
    const { emotion, text } = demoMix[demoStep];
    entries = entries.filter(e => e.date !== date);
    entries.push({ date, emotion, text });
    demoStep++;
    saveEntries(entries);
    renderAll();
  }

  function updateDemoButton() {
    const btn = document.getElementById("demo-btn");
    btn.textContent = demoStep >= demoMix.length
      ? "Demo completa ✓ (Reiniciar para repetir)"
      : `Avanzar un día (demo) — día ${demoStep + 1} de 7`;
  }

  // ---------- Render general ----------
  function renderAll() {
    drawPlant();
    drawPicker();
    drawSuggestion();
    drawStats();
    drawHistory();
    fillFeelingText();
    updateDemoButton();
  }

  // ---------- Eventos de botones fijos ----------
  document.getElementById("reset-btn").onclick = resetGarden;
  document.getElementById("demo-btn").onclick = advanceDemoDay;
  document.getElementById("save-text-btn").onclick = saveFeelingText;
  document.getElementById("toggle-history").onclick = () => {
    const hist = document.getElementById("history");
    const visible = hist.style.display === "flex";
    hist.style.display = visible ? "none" : "flex";
    document.getElementById("toggle-history").textContent = visible ? "Ver últimos 14 días" : "Ocultar historial";
  };

  renderAll();
</script>

</body>
</html>
